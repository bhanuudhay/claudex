# Every credential mechanism claudex supports, and how each behaves.
#
#   profile    token injected per process into a per-account config dir. The
#              stored login, cached account identity and usage counters are that
#              account's own, so a switched-to account never reports the previous
#              account's expired token or /usage. Transcripts and your own setup
#              (settings, CLAUDE.md, commands, agents, skills, plugins, hooks)
#              stay shared, so an interrupted conversation still resumes on the
#              next account. Cross-platform. Default, and the recommended one.
#              `provider: oauth` is accepted and means this.
#
#   oauth-shared
#              token injected per process, sharing all of ~/.claude. What
#              `oauth` used to mean; keep it only if something depends on every
#              account seeing one config dir.
#
#   configdir  a separate CLAUDE_CONFIG_DIR per account, each with its own
#              `claude auth login`. Fully isolated settings, MCP servers and
#              history — which also means a conversation cannot be resumed
#              across the boundary. Cross-platform.
#
#   keychain   swaps the machine-wide macOS keychain item for the duration of
#              one command. Mutates global state: other `claude` processes
#              running at the same time will see the swap. macOS only.
#              Use only when an account cannot mint a long-lived token.

version: 1

# Point claudex at a specific binary if the real CLI is not on PATH, or if you
# installed the `claude` shim and want to be explicit.
claude_path: ~/.local/bin/claude

defaults:
  provider: profile
  max_switches: 4
  rotate_on: [usage_limit, rate_limit, overloaded, auth_expired, credit_exhausted]
  quiet: false

accounts:
  # Token from an environment variable.
  - name: Personal
    provider: profile
    priority: 1
    token: ${CLAUDE_TOKEN_1}

  # Token from the claudex credential store, written by `claudex accounts add`.
  - name: Work
    provider: profile
    priority: 2
    token: store:Work

  # Token read from a file managed by a secret manager.
  - name: Team
    provider: profile
    priority: 3
    token: file:~/.secrets/claude-team-token

  # Token read from a macOS keychain item you created yourself.
  - name: Contract
    provider: profile
    priority: 4
    token: keychain:claudex/contract

  # Separate CLI profile with its own login.
  - name: Isolated
    provider: configdir
    priority: 5
    config_dir: ~/.claude-profiles/isolated

  # Whole-credential swap through the macOS keychain.
  - name: Legacy
    provider: keychain
    priority: 6
    keychain_service: Claude Code-credentials
    keychain_account: legacy@example.com
